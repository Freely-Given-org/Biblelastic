copyright = "Meditaciones sobre el Salmo 119, 2026, by Michael Coughlin. Con el espíritu de dar de gracia (Mateo 10:8), dedico esta obra al dominio público. Puedes copiar, imprimir, traducir o usar libremente esta obra. Confío en que se usará para la gloria de nuestro Salvador resucitado, Jesucristo. Salvo que se indique otra cosa, las citas de la Escritura son de la Reina-Valera de 1909, que es de dominio público. En este libro el nombre divino se imprime como “Yahvé” donde la Reina-Valera dice “Jehová”. Las citas breves de otras obras, como una línea del himno In Christ Alone, de Keith Getty y Stuart Townend (capítulo 16), se citan bajo el uso legítimo y siguen siendo propiedad de sus dueños. La dedicación al dominio público de arriba se aplica a mi propia escritura, no a esas citas. Nota sobre la traducción. Este libro se escribió originalmente en inglés, y las citas de la Escritura están tomadas de la Reina-Valera de 1909. Algunas frases del autor dependen de cómo suenan o se traducen ciertas palabras en las versiones bíblicas en inglés: juegos de palabras, títulos y comparaciones entre versiones. Donde fue posible, esas comparaciones se adaptaron o se quitaron. En otros lugares, una frase puede sonar extraña o menos natural en español, simplemente porque solo tenía sentido en la Biblia en inglés. Pedimos paciencia al lector: la idea de fondo es siempre la del autor. Te invito a memorizar el Salmo. Unas notas. En esta edición en español cito la Escritura de la Reina-Valera de 1909, que es de dominio público. Así puedes copiar, imprimir y compartir este libro con libertad, y me mantengo fiel a mi deseo de asociarme y trabajar con personas y ministerios que promueven la causa de dar de gracia."
