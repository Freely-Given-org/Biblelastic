files = ["Biblelastic/build/downloads/books.freely.giving/god-spoke.epub"]
copyright = "God Spoke, 2025, by Matthew Mangum. To the extent possible under law, Matthew J. D. Mangum has waived all copyright and related or neighboring rights to God Spoke: The Story of How We Came to Have the Bible as We Know It Today and dedicated it to the public domain. You may copy, translate, modify, and distribute this resource without restriction and without needing to ask permission. This resource is freely given for the sake of the gospel (Matt 10:8). This work is published from the United States. Unless otherwise noted, all Scripture quotations are from the Berean Standard Bible (BSB). The Holy Bible, Berean Standard Bible, BSB is produced in cooperation with Bible Hub, Discovery Bible, OpenBible.com, and the Berean Bible Translation Committee. This text of God's Word has been dedicated to the public domain. Because I do not expect all of my readers to read the copyright page, I have chosen to include a section here to highlight the freely shareable nature of this book. I have dedicated this book to the public domain, meaning that you can freely copy, translate, modify, and distribute this book without restriction and without needing to ask for my permission. This is a resource freely given for the use and edification of the body of Christ. You may visit equipthesaints.church to find a freely available digital copy of the book, freely available audiobook, audiobook supplemental material, as well as (Lord willing) other books and resources I hope to make available in the future. Physical copies of this book will be sold at the lowest cost possible and will not be priced for profit. We live at a time in our culture when we are inundated with a plethora of Christian resources, yet very few of them are freely available and shareable. Most resources, including English Bible translations, are locked behind copyrights which prevent their free use and distribution, including to other countries where our brothers and sisters do not have access to the wealth of resources that we possess. Yet Christ freely gave to us; should we not also freely give? The sale of ministry has become, in my estimation, far too unquestioningly accepted in our time and is, I believe, in need of reform. In our digital age, it is easier than ever to cheaply and widely distribute resources for the edification of the body. Keeping these tools behind paywalls, copyright restrictions, or even “free book” offers that require a transaction of handing over personal information seems to be at odds with the generosity God has shown toward us; freely we have received, so freely we should give. I have become convinced of the argument that ministry should be supported and not sold, and so I offer this book freely in service of Christ’s church. I would urge you to consider the case for freely giving found in Conley Owens’ book The Dorean Principle, as well as online at sellingjesus.org and copy.church. Whether or not you agree with the conclusions in whole, I believe you will be challenged to rethink the current paradigm."
