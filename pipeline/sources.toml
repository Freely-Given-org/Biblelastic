[[edition]]
id = "BSB"
name = "Berean Standard Bible"
language = "eng"
script = "Latn"
versification = "eng"
format = "ESFM" # Written from the BSB's tables by BibleOrgSys (biblelastic_ingest/bibleorgsys.py), with each word's row in the OET's word tables where it has one
copyright = "The Holy Bible, Berean Standard Bible, BSB is produced in cooperation with Bible Hub, Discovery Bible, OpenBible.com, and the Berean Bible Translation Committee. This text of God’s Word has been dedicated to the public domain."
licence = "Public domain"
redistributable = true
licence_verified = true
starter = false
source = "https://berean.bible/terms.htm"
files = ["Biblelastic/build/converted/BSB/BSB_*.ESFM"]
convert = { reader = "CSVBible", from = "OpenBibleData/copiedBibles/English/Berean.Bible/BSB/bsb_tables.tsv", remove = ["[", "]", "{", "}"] } # (The brackets mark words that the printed BSB doesn't mark)
