name = "Berean Standard Bible"
language = "eng"
script = "Latn"
versification = "eng"
format = "ESFM" # Written from the BSB's tables by BibleOrgSys (biblelastic_ingest/bibleorgsys.py), with each word's row in the OET's word tables where it has one
