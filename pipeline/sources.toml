# Commentaries and dictionaries are made of items (study notes, articles, etc.). Each item becomes an entry in a document:
#   item_documents says which document each type of item goes into ("*" means one document for each Bible book that the items are about).
#   Types that aren't listed are left out.

[[edition]]
id = "TOSN"
kind = "commentary"
name = "Tyndale Open Study Notes, adapted for the OET"
language = "eng"
script = "Latn"
versification = "eng"
format = "TyndaleXML"
copyright = "Copyright © 2022 by Tyndale House Publishers"
licence = "CC BY-SA 4.0"
attribution = "Adapted from Tyndale Open Study Notes. The original work by Tyndale House Publishers is available for free at http://www.tyndaleopenresources.com."
changes = "Names and some other wording were changed by Freely-Given.org to match the Open English Translation (see ADAPTATION_NOTICE.md in https://github.com/Freely-Given-org/OET_TyndaleOpenResources), then it was converted to the Biblelastic module format."
redistributable = true
licence_verified = false
files = ["OpenBibleData/datasets/Tyndale/OET_TyndaleOpenResources/Tyndale Open Study Notes/*.xml"]
features = []
item_documents = { StudyNote = "*", BookIntro = "Intros", BookIntroSummary = "Summaries", Profile = "Profiles", ThemeNote = "Themes" }

[[edition]]
id = "TOBD"
kind = "dictionary"
name = "Tyndale Open Bible Dictionary, adapted for the OET"
language = "eng"
script = "Latn"
versification = "eng"
format = "TyndaleXML"
copyright = "Copyright © 2023 by Tyndale House Publishers"
licence = "CC BY-SA 4.0"
attribution = "Adapted from Tyndale Open Bible Dictionary. The original work by Tyndale House Publishers is available for free at http://www.tyndaleopenresources.com."
changes = "Names and some other wording were changed by Freely-Given.org to match the Open English Translation (see ADAPTATION_NOTICE.md in https://github.com/Freely-Given-org/OET_TyndaleOpenResources), then it was converted to the Biblelastic module format, without the maps' image files."
redistributable = true
licence_verified = false
files = ["OpenBibleData/datasets/Tyndale/OET_TyndaleOpenResources/TyndaleOpenBibleDictionary/*/*.xml"]
features = []
item_documents = { Article = "Articles", Textbox = "Textboxes", Chart = "Charts", Map = "Maps", Picture = "Pictures" }

