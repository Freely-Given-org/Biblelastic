# Biblelastic source registry
#
# Paths are relative to the source root, which defaults to the folder containing this repository
#   (override with --source-root or the BIBLELASTIC_SOURCE_ROOT environment variable).
#
# licence_verified must be set to true by a person who has checked the licence at its source.
#   Nothing may be published from an edition where it's false.

[[edition]]
id = "OET-RV"
name = "Open English Translation—Readers’ Version"
language = "eng"
script = "Latn"
versification = "OET-RV"
format = "ESFM"
copyright = "Copyright © 2010–2026 Freely-Given.org"
licence = "CC BY-SA 4.0"
redistributable = true
licence_verified = false
files = ["OpenEnglishTranslation--OET/translatedTexts/ReadersVersion/OET-RV_*.ESFM"]
features = ["row"]

[[edition]]
id = "OET-LV"
name = "Open English Translation—Literal Version"
language = "eng"
script = "Latn"
versification = "OET-LV"
format = "ESFM"
copyright = "Copyright © 2010–2026 Freely-Given.org"
licence = "CC BY-SA 4.0"
redistributable = true
licence_verified = false
files = [
    "OpenEnglishTranslation--OET/derivedTexts/auto_edited_OT_ESFM/OET-LV_*.ESFM",
    "OpenEnglishTranslation--OET/derivedTexts/auto_edited_DC_ESFM/OET-LV_*.ESFM",
    "OpenEnglishTranslation--OET/derivedTexts/auto_edited_VLT_ESFM/OET-LV_*.ESFM",
]
features = ["row"]

[[edition]]
id = "SR-GNT"
name = "Statistical Restoration Greek New Testament"
language = "grc"
script = "Grek"
versification = "org"
format = "USFM"
copyright = "Copyright © 2022–2024 by Alan Bunning"
licence = "CC BY 4.0"
redistributable = true
licence_verified = false
files = ["Forked/CNTR-SR/SR usfm/*.usfm"]
features = ["lemma", "strong", "morph", "koine", "translit", "lemma_translit", "oet_row"]
transliterate = "Greek"
# Link each word to its row in the OET word table (the rows marked as being in the SR text)
row_table = "OpenEnglishTranslation--OET/translatedTexts/ReadersVersion/OET-LV_NT_word_table.tsv"
row_table_word_column = "GreekWord"
row_table_filter_column = "Probability"
row_table_filter_values = ["X"]

[edition.layer] # Extra features for each word, taken from the word table (our column = table column)
id = "OET"
name = "OET word-table glosses, roles, and tags"
copyright = "Copyright © 2010–2026 Freely-Given.org, derived from the CNTR Verifiable Literal Translation glosses (Copyright © 2022 GreekCNTR.org)"
licence = "CC BY-SA 4.0"
licence_verified = false
columns = { gloss = "OETGlossWords", gloss_caps = "GlossCaps", role = "Role", tags = "Tags" }

[edition.variants] # Word-table rows for words that aren't in the SR text
id = "OET-variants"
name = "Variant readings from the CNTR collation, as listed in the OET word table"
copyright = "Copyright © 2022 GreekCNTR.org"
licence = "CC BY 4.0"
licence_verified = false
filter_values = ["", "H"]
columns = { ref = "Ref", status = "Probability", text = "GreekWord", lemma = "GreekLemma", strong = "StrongsExt", morph = "Morphology", role = "Role", gloss = "OETGlossWords" }

[[edition]]
id = "UHB"
name = "unfoldingWord® Hebrew Bible"
language = "hbo"
script = "Hebr"
versification = "eng"
format = "USFM"
copyright = "Copyright © unfoldingWord"
licence = "CC BY-SA 4.0"
redistributable = true
licence_verified = false
files = ["OpenBibleData/copiedBibles/Original/unfoldingWord.org/UHB/*.usfm"]
features = ["lemma", "strong", "morph", "lang", "cons", "translit", "lemma_translit", "oet_row"]
transliterate = "Hebrew"
row_table = "OpenEnglishTranslation--OET/translatedTexts/ReadersVersion/OET-LV_OT_word_table.tsv"
row_table_word_column = "Word"
row_table_filter_column = "RowType"
row_table_filter_values = ["", "A", "K", "AK"]

[edition.layer]
id = "OET"
name = "OET word-table glosses, roles, syntax, and tags"
copyright = "Glosses by Freely-Given.org; Hebrew parsing Copyright © 2019 hb.openscriptures.org"
licence = "CC BY-SA 4.0"
licence_verified = false
columns = { gloss = "WordGloss", context_gloss = "ContextualWordGloss", morpheme_glosses = "MorphemeGlosses", context_morpheme_glosses = "ContextualMorphemeGlosses", role = "Role", nesting = "Nesting", tags = "Tags", row_type = "RowType" }

# Commentaries and dictionaries are made of items (study notes, articles, etc.). Each item becomes an entry in a document:
#   item_documents says which document each type of item goes into ("*" means one document for each Bible book that the items are about).
#   Types that aren't listed are left out.

[[edition]]
id = "TOSN"
kind = "commentary"
name = "Tyndale Open Study Notes, adapted for the OET"
language = "eng"
script = "Latn"
versification = "eng"
format = "TyndaleXML"
copyright = "Copyright © 2022 by Tyndale House Publishers"
licence = "CC BY-SA 4.0"
attribution = "Adapted from Tyndale Open Study Notes. The original work by Tyndale House Publishers is available for free at http://www.tyndaleopenresources.com."
changes = "Names and some other wording were changed by Freely-Given.org to match the Open English Translation (see ADAPTATION_NOTICE.md in https://github.com/Freely-Given-org/OET_TyndaleOpenResources), then it was converted to the Biblelastic module format."
redistributable = true
licence_verified = false
files = ["OpenBibleData/datasets/Tyndale/OET_TyndaleOpenResources/Tyndale Open Study Notes/*.xml"]
features = []
item_documents = { StudyNote = "*", BookIntro = "Intros", BookIntroSummary = "Summaries", Profile = "Profiles", ThemeNote = "Themes" }

[[edition]]
id = "TOBD"
kind = "dictionary"
name = "Tyndale Open Bible Dictionary, adapted for the OET"
language = "eng"
script = "Latn"
versification = "eng"
format = "TyndaleXML"
copyright = "Copyright © 2023 by Tyndale House Publishers"
licence = "CC BY-SA 4.0"
attribution = "Adapted from Tyndale Open Bible Dictionary. The original work by Tyndale House Publishers is available for free at http://www.tyndaleopenresources.com."
changes = "Names and some other wording were changed by Freely-Given.org to match the Open English Translation (see ADAPTATION_NOTICE.md in https://github.com/Freely-Given-org/OET_TyndaleOpenResources), then it was converted to the Biblelastic module format, without the maps' image files."
redistributable = true
licence_verified = false
files = ["OpenBibleData/datasets/Tyndale/OET_TyndaleOpenResources/TyndaleOpenBibleDictionary/*/*.xml"]
features = []
item_documents = { Article = "Articles", Textbox = "Textboxes", Chart = "Charts", Map = "Maps", Picture = "Pictures" }

# Thesauruses connect the words that people search with to the titles of entries in the dictionaries and commentaries.
#   Columns: term, see (entry titles on the subject), contrast (entry titles for the other side of a question), note. Lists are separated by semicolons.
[[thesaurus]]
language = "eng"
file = "thesaurus/eng.tsv" # Relative to the pipeline folder: this one is written for Biblelastic
copyright = "Freely-Given.org"
licence = "CC0 1.0"

[tools]
# Optional: https://github.com/Freely-Given-org/BibleTransliterations (CC0), used for the translit columns
transliterations = "BibleTransliterations/Python"

# Word alignments that can be derived by joining on OET word-table row numbers
[[alignment]]
from = "OET-LV"
to = ["SR-GNT", "UHB"]

[[alignment]]
from = "OET-RV"
to = ["SR-GNT", "UHB"]
