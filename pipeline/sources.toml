# Biblelastic source registry
#
# Paths are relative to the source root, which defaults to the folder containing this repository
#   (override with --source-root or the BIBLELASTIC_SOURCE_ROOT environment variable).
#
# licence_verified must be set to true by a person who has checked the licence at its source.
#   Nothing may be published from an edition where it's false.

# More editions, in files of their own (books-freely-giving.toml is written by `python3 -m biblelastic_ingest.freely_giving`)
include = ["books-freely-giving.toml"]

[[edition]]
id = "OET-RV"
name = "Open English Translation—Readers’ Version"
language = "eng"
script = "Latn"
versification = "OET-RV"
format = "ESFM"
copyright = "Copyright © 2010–2026 Robert Hunt (Freely-Given.org)"
licence = "CC BY-SA 4.0"
redistributable = true
licence_verified = true
files = ["OpenEnglishTranslation--OET/translatedTexts/ReadersVersion/OET-RV_*.ESFM"]
features = ["row"]

[[edition]]
id = "OET-LV"
name = "Open English Translation—Literal Version"
language = "eng"
script = "Latn"
versification = "OET-LV"
format = "ESFM"
copyright = "Copyright © 2010–2026 Robert Hunt (Freely-Given.org)"
licence = "CC BY-SA 4.0"
redistributable = true
licence_verified = true
files = [
    "OpenEnglishTranslation--OET/derivedTexts/auto_edited_OT_ESFM/OET-LV_*.ESFM",
    "OpenEnglishTranslation--OET/derivedTexts/auto_edited_DC_ESFM/OET-LV_*.ESFM",
    "OpenEnglishTranslation--OET/derivedTexts/auto_edited_VLT_ESFM/OET-LV_*.ESFM",
]
features = ["row"]

[[edition]]
id = "SR-GNT"
name = "Statistical Restoration Greek New Testament"
language = "grc"
script = "Grek"
versification = "org"
format = "USFM"
copyright = "Copyright © 2022–2023 by Alan Bunning"
licence = "CC BY 4.0"
redistributable = true
licence_verified = true
files = ["Forked/CNTR-SR/SR usfm/*.usfm"]
features = ["lemma", "strong", "morph", "koine", "translit", "lemma_translit", "oet_row"]
transliterate = "Greek"
# Link each word to its row in the OET word table (the rows marked as being in the SR text)
row_table = "OpenEnglishTranslation--OET/translatedTexts/ReadersVersion/OET-LV_NT_word_table.tsv"
row_table_word_column = "GreekWord"
row_table_filter_column = "Probability"
row_table_filter_values = ["X"]

[edition.layer] # Extra features for each word, taken from the word table (our column = table column)
id = "OET"
name = "OET word-table glosses, roles, and tags"
copyright = "Copyright © 2010–2026 Robert Hunt (Freely-Given.org), derived from the CNTR Verifiable Literal Translation glosses (Copyright © 2022 GreekCNTR.org)"
licence = "CC BY-SA 4.0"
licence_verified = true
columns = { gloss = "OETGlossWords", gloss_caps = "GlossCaps", role = "Role", tags = "Tags" }

[edition.variants] # Word-table rows for words that aren't in the SR text
id = "OET-variants"
name = "Variant readings from the CNTR collation, as listed in the OET word table"
copyright = "Copyright © 2022 GreekCNTR.org"
licence = "CC BY 4.0"
licence_verified = true
filter_values = ["", "H"]
columns = { ref = "Ref", status = "Probability", text = "GreekWord", lemma = "GreekLemma", strong = "StrongsExt", morph = "Morphology", role = "Role", gloss = "OETGlossWords" }

[[edition]]
id = "UHB"
name = "unfoldingWord® Hebrew Bible"
language = "hbo"
script = "Hebr"
versification = "eng"
format = "USFM"
copyright = "Copyright © 2022 by unfoldingWord"
# Its licence requires this of a derivative work (and that a modified copy doesn't use the unfoldingWord® trademark: see docs/Licences.md)
attribution = "The original work by unfoldingWord is available from https://www.unfoldingword.org/uhb"
changes = "Converted to the Biblelastic module format by Freely-Given.org, with each word linked to the OET's word tables, and transliterations added."
licence = "CC BY-SA 4.0"
redistributable = true
licence_verified = true
files = ["OpenBibleData/copiedBibles/Original/unfoldingWord.org/UHB/*.usfm"]
features = ["lemma", "strong", "morph", "lang", "cons", "translit", "lemma_translit", "oet_row"]
transliterate = "Hebrew"
row_table = "OpenEnglishTranslation--OET/translatedTexts/ReadersVersion/OET-LV_OT_word_table.tsv"
row_table_word_column = "Word"
row_table_filter_column = "RowType"
row_table_filter_values = ["", "A", "K", "AK"]

[edition.layer]
id = "OET"
name = "OET word-table glosses, roles, syntax, and tags"
copyright = "Glosses by Robert Hunt (Freely-Given.org); Hebrew parsing Copyright © 2019 hb.openscriptures.org"
licence = "CC BY-SA 4.0"
licence_verified = true
columns = { gloss = "WordGloss", context_gloss = "ContextualWordGloss", morpheme_glosses = "MorphemeGlosses", context_morpheme_glosses = "ContextualMorphemeGlosses", role = "Role", nesting = "Nesting", tags = "Tags", row_type = "RowType" }

# Spanish Bibles, from the Bible Aquifer (https://github.com/BibleAquifer). Neither has section headings, so each takes the OET-RV's sections (at the same verses).
[[edition]]
id = "ASBRT"
name = "Texto Bíblico de Referencia en Español de Aquifer" # Aquifer Spanish Bible Reference Text
language = "spa"
script = "Latn"
versification = "eng"
format = "USFM"
copyright = "Aquifer Spanish Bible Reference Text © 2026 Mission Mutual (https://missionmutual.org), revised from Biblica's Open Nueva Biblia Viva"
changes = "Converted to the Biblelastic module format by Freely-Given.org, with section breaks at the OET-RV's, and its words linked to the Greek and Hebrew from the Aquifer's alignments."
licence = "CC BY-SA 4.0"
redistributable = true
licence_verified = true
source = "https://github.com/BibleAquifer/AquiferSpanishBibleReferenceText"
files = ["../Bibles/BibleAquifer/AquiferSpanishBibleReferenceText/spa/usfm/*.SFM"]
sections_from = "OET-RV"
