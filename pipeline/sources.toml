[[edition]]
id = "RV1909"
name = "Reina-Valera 1909"
language = "spa"
script = "Latn"
versification = "eng"
format = "USFM"
copyright = "Reina-Valera 1909: public domain (CC0), as published by the Bible Aquifer"
licence = "Public domain"
redistributable = true
licence_verified = true
source = "https://github.com/BibleAquifer/ReinaValera1909"
files = ["../Bibles/BibleAquifer/ReinaValera1909/spa/usfm/*.SFM"]
