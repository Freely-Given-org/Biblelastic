language = "spa"
script = "Latn"
versification = "eng"
format = "USFM"
copyright = "Aquifer Spanish Bible Reference Text © 2026 Mission Mutual (https://missionmutual.org), revised from Biblica's Open Nueva Biblia Viva"
licence = "CC BY-SA 4.0"
redistributable = true
licence_verified = false
source = "https://github.com/BibleAquifer/AquiferSpanishBibleReferenceText"
files = ["../Bibles/BibleAquifer/AquiferSpanishBibleReferenceText/spa/usfm/*.SFM"]
sections_from = "OET-RV"

[[edition]]
id = "RV1909"
name = "Reina-Valera 1909"
language = "spa"
script = "Latn"
versification = "eng"
format = "USFM"
copyright = "Reina-Valera 1909: public domain (CC0), as published by the Bible Aquifer"
licence = "Public domain"
redistributable = true
licence_verified = false
source = "https://github.com/BibleAquifer/ReinaValera1909"
files = ["../Bibles/BibleAquifer/ReinaValera1909/spa/usfm/*.SFM"]
features = ["strong"]
sections_from = "OET-RV"

# Shown with what each work of these kinds says, wherever it's shown (HTML: <em> and <a> are allowed)
[disclaimers]
commentary = "This material is included in good faith, but the views expressed are those of the author(s) and don't necessarily equate with the design decisions of the <em><a href=\"https://OpenEnglishTranslation.Bible\">Open English Translation</a> of the Bible</em>."
book = "This material is included in good faith, but the views expressed are those of the author(s) and don't necessarily equate with the design decisions of the <em><a href=\"https://OpenEnglishTranslation.Bible\">Open English Translation</a> of the Bible</em>."

[disclaimers.spa] # For works in Spanish (a translation of the above: to be checked)
commentary = "Este material se incluye de buena fe, pero las opiniones expresadas son las de su(s) autor(es) y no coinciden necesariamente con las decisiones de diseño de la <em><a href=\"https://OpenEnglishTranslation.Bible\">Open English Translation</a> de la Biblia</em>."
book = "Este material se incluye de buena fe, pero las opiniones expresadas son las de su(s) autor(es) y no coinciden necesariamente con las decisiones de diseño de la <em><a href=\"https://OpenEnglishTranslation.Bible\">Open English Translation</a> de la Biblia</em>."

