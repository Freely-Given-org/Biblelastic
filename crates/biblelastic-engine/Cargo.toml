[package]
name = "biblelastic-engine"
description = "The Biblelastic search engine: reads compiled modules and answers queries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately only one dependency (a zstd decoder in pure Rust, which has none of its own):
# the engine must stay small and build for WebAssembly as well as natively.
[dependencies]
ruzstd = { version = "0.9.1", default-features = false }
