<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 440">
  <!-- Biblelastic's logo: its icon, and its name as it was made, from ‘Bible’ and ‘fantastic’: ‘Bible’ in Freely-Given.org's dark green,
       the ‘l’ that joins them in brown, and ‘astic’ in the sparkles' gold; beneath it, ‘Fantastic Bible study’ in the same colours.
       The text needs Ubuntu (or falls back to another sans-serif font), so logo.png is the one to use elsewhere. -->
  <image href="icon.svg" x="20" y="20" width="400" height="400"/>
  <text x="470" y="250" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="172" font-weight="700" letter-spacing="-2"><tspan fill="#4E7A2A">Bible</tspan><tspan fill="#8B5A2B">l</tspan><tspan fill="#D9A21E">astic</tspan></text>
  <text x="478" y="350" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="62" font-weight="500" fill="#7A7A5A"><tspan>Fant</tspan><tspan fill="#D9A21E" font-weight="700">astic</tspan><tspan> </tspan><tspan fill="#4E7A2A" font-weight="700">Bible</tspan><tspan> study</tspan></text>
</svg>
