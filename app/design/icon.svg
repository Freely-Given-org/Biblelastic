<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Biblelastic's icon: an open Bible, with gold sparkles rising from it (Bible + fantastic), in Freely-Given.org's colours.
       app/design/make-icons.sh makes the app's icons from it (and, for Android's adaptive icon and the web's maskable one, from its <g id="book"> alone). -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86AF49"/>
      <stop offset="1" stop-color="#6A9638"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <g id="book">
    <defs>
      <!-- A four-pointed sparkle, 1 unit from its centre to each point -->
      <path id="sparkle" d="M0 -1 C0.2 -0.2 0.2 -0.2 1 0 C0.2 0.2 0.2 0.2 0 1 C-0.2 0.2 -0.2 0.2 -1 0 C-0.2 -0.2 -0.2 -0.2 0 -1 Z"/>
    </defs>
    <!-- The sparkles -->
    <g fill="#F4C64E">
      <use href="#sparkle" transform="translate(256 104) scale(62)"/>
      <use href="#sparkle" transform="translate(178 142) scale(26)"/>
      <use href="#sparkle" transform="translate(338 132) scale(32)"/>
    </g>
    <!-- The cover's edge, then the two pages -->
    <path d="M60 206 Q158 178 256 216 Q354 178 452 206 L452 420 Q354 394 256 434 Q158 394 60 420 Z" fill="#4E7A2A"/>
    <path d="M74 196 Q164 168 256 206 L256 418 Q164 382 74 406 Z" fill="#FFFAF0"/>
    <path d="M438 196 Q348 168 256 206 L256 418 Q348 382 438 406 Z" fill="#F3F0D8"/>
    <!-- Lines of text -->
    <g stroke="#B5C98A" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M104 232 Q164 216 226 236"/>
      <path d="M104 268 Q164 252 226 272"/>
      <path d="M104 304 Q164 288 226 308"/>
      <path d="M104 340 Q150 328 196 340"/>
      <path d="M286 236 Q348 216 408 232"/>
      <path d="M286 272 Q348 252 408 268"/>
      <path d="M286 308 Q348 288 408 304"/>
    </g>
    <path d="M256 206 L256 418" stroke="#C9C48A" stroke-width="4"/>
  </g>
</svg>
